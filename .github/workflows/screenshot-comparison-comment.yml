name: screenshot-comparison-comment

on:
  workflow_run:
    workflows: ["screenshot-comparison"]
    types: [completed]

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Download Artifact for PR Number
        uses: dawidd6/action-download-artifact@v3
        with:
          name: screenshot-diff-reports
          run_id: ${{ github.event.workflow_run.id }}
          path: diff-reports

      - id: get-pull-request-number
        run: |
          NR_FILE=$(find diff-reports -name "NR" -print -quit)

          if [ -z "$NR_FILE" ]; then
            echo "Error: PR number file (NR) not found in artifacts"
            exit 1
          fi

          PR_NUMBER=$(tr -d '[:space:]' < "$NR_FILE")
          echo "pull_request_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout Default Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Switch to Companion Branch
        env:
          BRANCH_NAME: companion_${{ github.event.workflow_run.head_branch }}
        run: |
          git branch -D "$BRANCH_NAME" || true
          git checkout --orphan "$BRANCH_NAME"
          git rm -rf .

      - name: Download Diff Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: screenshot-diff-reports
          run_id: ${{ github.event.workflow_run.id }}
          path: diff-reports

      - name: Push to Companion Branch
        env:
          BRANCH_NAME: companion_${{ github.event.workflow_run.head_branch }}
        run: |
          ls -R
          find . -name "*_compare.png" -exec mv {} . \;
          mapfile -d '' -t files_to_add < <(find . -type f -name "*_compare.png" -print0)

          for file in "${files_to_add[@]}"; do
            if [[ "$file" =~ ^([-0-9A-Z_a-z.\ \/]|\[|\])+$ ]]; then
            git add "$file"
            echo "exists=true" >> "$GITHUB_ENV"
            fi
          done

          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "ScreenshotBot"
            git config --global user.email "bot@github.com"
            git commit -m "Add screenshot diffs"
            git push origin HEAD:"$BRANCH_NAME" -f
          fi

      - name: Generate Report Body
        if: env.exists == 'true'
        id: generate_report
        run: |
          BRANCH="companion_${{ github.event.workflow_run.head_branch }}"
          REPO="${{ github.repository }}"

          mapfile -d '' -t files < <(find . -type f -name "*_compare.png" -print0)

          {
            echo "REPORT_BODY<<EOF"
            echo "### Roborazzi Snapshot Diff Report"
            echo ""
            echo "| File Name | Comparison |"
            echo "|---|---|"

            for file in "${files[@]}"; do
              fileName=$(basename "$file")

              urlPart="${BRANCH//#/%23}/${fileName//#/%23}"
              urlPart="${urlPart//[/%5B}"
              urlPart="${urlPart//]/%5D}"
              urlPart="${urlPart// /%20}"

              URL="https://github.com/${REPO}/blob/${urlPart}?raw=true"

              DISPLAY_NAME=$(echo "$fileName" | sed -r 's/(.{20})/\1<br>/g')

              echo "| $DISPLAY_NAME | ![]($URL) |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find Old Comment
        if: env.exists == 'true'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ steps.get-pull-request-number.outputs.pull_request_number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Roborazzi Snapshot Diff Report'

      - name: Add or Update Comment
        if: env.exists == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.get-pull-request-number.outputs.pull_request_number }}
          body: ${{ steps.generate_report.outputs.REPORT_BODY }}
          edit-mode: replace

      - name: Cleanup outdated companion branches
        shell: bash
        run: |
          git branch -r --format="%(refname:lstrip=3)" | grep companion_ | while read -r branch; do
            last_commit_date_timestamp=$(git log -1 --format=%ct "origin/$branch")
            now_timestamp=$(date +%s)

            # 30 days
            if [ $((now_timestamp - last_commit_date_timestamp)) -gt 2592000 ]; then
              echo "Deleting outdated branch: $branch"
              git push origin --delete "$branch"
            fi
          done
