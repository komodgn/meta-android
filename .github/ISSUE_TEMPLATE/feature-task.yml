name: "✨ Feature Request"
description: "Suggest a new idea or submit a feature implementation task."
title: "[Feature] "
labels: ["feature", "enhancement"]
body:
    - type: textarea
      id: feature_summary
      attributes:
          label: "📝 Feature Summary"
          description: "What is the goal of this feature?"
          placeholder: "e.g., Add gesture control for D3.js gallery view"
      validations:
          required: true

    - type: textarea
      id: user_story
      attributes:
          label: "💡 User Story / Motivation"
          description: "Explain why this feature is needed and how it benefits the user."
          placeholder: "As a user, I want to... so that..."
      validations:
          required: false

    - type: textarea
      id: tasks
      attributes:
          label: "🔧 Development Tasks"
          value: |
              - [ ] Requirement Analysis
              - [ ] UI/UX Design (if applicable)
              - [ ] Implementation
              - [ ] Verification & Testing
      validations:
          required: true

    - type: textarea
      id: tech_stack
      attributes:
          label: "🛠 Technical Details"
          description: "Mention any specific libraries or architectures (e.g., Circuit, Room)."
      validations:
          required: false
