[versions]
## Application
applicationId = "com.example.metasearch"
compileSdk = "36"
targetSdk = "36"
minSdk = "30"
versionCode = "1"
versionName = "1.0.0"

## Android Gradle Plugin
agp = "8.13.2"

## Android gradle plugin
androidGradlePlugin = "8.13.2"

## AndroidX
activityCompose = "1.12.1"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
androidxDataStore = "1.2.0"
coreSplashscreen = "1.2.0"

## Permisson
accompanistPermissions = "0.37.3"

## Kotlin Symbol Processing
ksp = "2.2.20-2.0.3"

## Kotlin
kotlin = "2.2.21"
kotlinxCoroutines =  "1.10.2"
kotlinxSerializationJson = "1.9.0"

desugarJdkLibs = "2.1.5"

## Network
okhttp = "5.3.2"
retrofit = "3.0.0"

coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"

truth = "1.1.5"

junitJupiterApi = "6.0.1"
mockitoCore = "5.21.0"
mockitoKotlin = "6.1.0"

## Compose
composeBom = "2025.12.00"
composeStableMarker = "1.0.7"
constraintlayoutCompose = "1.1.1"

## Coil
coilCompose = "3.3.0"

## Circuit
circuit = "0.31.0"

## Hilt
hilt = "2.57.2"

## Room
room = "2.8.4"

## Extension
composeExtensions = "25.5.1"

accompanistSystemUiController = "0.36.0"

jetbrainsKotlinJvm = "2.2.21"

## Lint
ktlintPlugin = "11.6.1"
ktlintEngine = "0.50.0"

# Static Analysis
detektPlugin = "1.23.8"
appcompat = "1.7.1"
material = "1.13.0"

[libraries]
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
